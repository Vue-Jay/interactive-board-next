<title>Lektrus — временно недоступен</title>
<style>
.lektrus-unavailable{--u-page:var(--lt-page,#f2f5fa);--u-surface:var(--lt-surface,#fff);--u-text:var(--lt-text,#172a45);--u-muted:var(--lt-secondary,#425a78);--u-line:var(--lt-line,#d5dfed);--u-accent:var(--lt-primary,#3056c8);--u-soft:var(--lt-selected,#e6eeff);--u-ink:var(--lt-selected-ink,#244da9);--u-warn:#a56b14;--u-warn-bg:#fff4db;position:fixed;left:0;right:0;top:0;bottom:0;z-index:20000;box-sizing:border-box;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;padding:24px;padding:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px));background:radial-gradient(ellipse at 80% 12%,var(--u-soft) 0%,transparent 48%),var(--u-page);color:var(--u-text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;text-align:left;line-height:1.5}
.lektrus-unavailable *{box-sizing:border-box}
.lektrus-unavailable .u-shell{width:100%;max-width:840px;margin:auto}
.lektrus-unavailable .u-brand{display:flex;align-items:center;margin-bottom:20px;color:var(--u-text)}
.lektrus-unavailable .u-brand img{width:38px;height:38px;margin-right:9px;object-fit:contain}
.lektrus-unavailable .u-brand strong{font-size:25px;font-weight:800;letter-spacing:-.055em}
.lektrus-unavailable .u-brand small{margin-left:auto;font-size:11px;color:var(--u-muted);letter-spacing:.07em;font-weight:700;text-transform:uppercase}
.lektrus-unavailable .u-card{display:grid;grid-template-columns:minmax(0,1.13fr) minmax(0,.87fr);overflow:hidden;border-radius:26px;border:1px solid var(--u-line);background:var(--u-surface);box-shadow:0 24px 72px rgba(25,46,86,.10)}
.lektrus-unavailable .u-content{padding:36px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.lektrus-unavailable .u-status{display:inline-flex;align-items:center;padding:6px 10px;border-radius:100px;background:var(--u-warn-bg);color:var(--u-warn);font-size:11px;font-weight:750;line-height:1.3}
.lektrus-unavailable .u-status i{width:7px;height:7px;background:currentColor;border-radius:50%;margin-right:7px}
.lektrus-unavailable h1{font-size:34px;font-size:clamp(26px,3.5vw,38px);font-weight:820;letter-spacing:-.047em;line-height:1.13;margin:18px 0 12px;color:var(--u-text);overflow-wrap:break-word}
.lektrus-unavailable .u-description{font-size:15px;line-height:1.65;margin:0 0 22px;color:var(--u-muted)}
.lektrus-unavailable .u-retry{display:flex;align-items:center;justify-content:center;width:100%;max-width:310px;min-height:48px;padding:12px 16px;border:0;border-radius:12px;background:var(--u-accent);color:#fff;font:inherit;font-weight:750;cursor:pointer;touch-action:manipulation;transition:filter .15s}
.lektrus-unavailable .u-retry svg{flex:none;width:18px;height:18px;margin-right:9px}
.lektrus-unavailable .u-retry:hover{filter:brightness(.94)}
.lektrus-unavailable .u-retry:focus-visible{outline:3px solid var(--u-ink);outline-offset:3px}
.lektrus-unavailable .u-retry:disabled{opacity:.72;cursor:wait}
.lektrus-unavailable .u-retry:disabled svg{animation:u-spin 1.2s linear infinite}
.lektrus-unavailable .u-note{font-size:12px;line-height:1.55;color:var(--u-muted);margin:12px 0 0;min-height:36px}
.lektrus-unavailable .u-art{position:relative;min-width:0;min-height:270px;display:grid;place-items:center;background:linear-gradient(145deg,var(--u-soft),var(--u-page));border-left:1px solid var(--u-line);overflow:hidden;padding:22px}
.lektrus-unavailable .u-art svg{width:100%;max-width:290px;height:auto;overflow:visible;color:var(--u-ink)}
.lektrus-unavailable .u-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;font-size:12px;color:var(--u-muted)}
.lektrus-unavailable .u-footer span{margin-right:12px}
@keyframes u-spin{to{transform:rotate(360deg)}}
@media(max-width:620px){.lektrus-unavailable{padding:16px;padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}.lektrus-unavailable .u-brand{margin-bottom:12px}.lektrus-unavailable .u-brand img{width:33px;height:33px}.lektrus-unavailable .u-brand strong{font-size:22px}.lektrus-unavailable .u-card{grid-template-columns:minmax(0,1fr);border-radius:20px}.lektrus-unavailable .u-art{order:-1;min-height:0;height:168px;padding:12px;border-left:0;border-bottom:1px solid var(--u-line)}.lektrus-unavailable .u-art svg{width:190px;max-height:142px}.lektrus-unavailable .u-content{padding:24px 20px}.lektrus-unavailable h1{font-size:28px;margin:14px 0 10px}.lektrus-unavailable .u-description{font-size:14px;margin-bottom:18px}.lektrus-unavailable .u-retry{max-width:none}.lektrus-unavailable .u-note{min-height:0}.lektrus-unavailable .u-footer{margin-top:12px}}
@media(max-height:460px) and (orientation:landscape){.lektrus-unavailable{padding:10px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}.lektrus-unavailable .u-brand{margin-bottom:7px}.lektrus-unavailable .u-brand img{width:28px;height:28px}.lektrus-unavailable .u-content{padding:18px 22px}.lektrus-unavailable .u-art{min-height:0;padding:12px}.lektrus-unavailable .u-art svg{max-width:215px}.lektrus-unavailable h1{font-size:25px;margin:10px 0 6px}.lektrus-unavailable .u-description{font-size:13px;margin-bottom:12px}.lektrus-unavailable .u-note{margin-top:8px;min-height:0}.lektrus-unavailable .u-footer{margin-top:6px}}
html[data-theme=dark] .lektrus-unavailable{--u-page:var(--lt-page,#101a29);--u-surface:var(--lt-surface,#19283b);--u-text:var(--lt-text,#f2f6ff);--u-muted:var(--lt-secondary,#d2dff0);--u-line:var(--lt-line,#3a506a);--u-soft:var(--lt-selected,#293c64);--u-ink:var(--lt-selected-ink,#bdd0ff);--u-warn:#ffd78f;--u-warn-bg:#513c1f}
@media(prefers-color-scheme:dark){html:not([data-theme]) .lektrus-unavailable{--u-page:#101a29;--u-surface:#19283b;--u-text:#f2f6ff;--u-muted:#d2dff0;--u-line:#3a506a;--u-soft:#293c64;--u-ink:#bdd0ff;--u-warn:#ffd78f;--u-warn-bg:#513c1f}}
@media(prefers-reduced-motion:reduce){.lektrus-unavailable .u-retry{transition:none}.lektrus-unavailable .u-retry:disabled svg{animation:none}}
</style>
