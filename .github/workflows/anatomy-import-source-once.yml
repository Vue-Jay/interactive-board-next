name: Import verified histology specimens (temporary)
on:
  push:
    branches:
      - feat/anatomy-licensed-histology-specimens-20261106
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anatomy-licensed-histology-specimens-20261106
          persist-credentials: true
      - name: Fetch original licensed specimen files and verify publisher checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/bio-atlas/specimens
          curl --retry 3 --fail --location --silent --show-error \
            'https://upload.wikimedia.org/wikipedia/commons/4/41/Histology_of_thin_skin.jpg' \
            -o src/assets/bio-atlas/specimens/skin-thin-bhavya-akula-cc-by-sa4.jpg
          curl --retry 3 --fail --location --silent --show-error \
            'https://upload.wikimedia.org/wikipedia/commons/2/20/Histology_of_thick_skin.jpg' \
            -o src/assets/bio-atlas/specimens/skin-thick-bhavya-akula-cc-by-sa4.jpg
          printf '%s  %s\n' \
            '5f74f84105b13bdc7dc880d3bc38ef2bc2404d07' \
            'src/assets/bio-atlas/specimens/skin-thin-bhavya-akula-cc-by-sa4.jpg' | sha1sum -c
          printf '%s  %s\n' \
            '9eba91a3b2060e7d626a301ef1e278fa9897ebb6' \
            'src/assets/bio-atlas/specimens/skin-thick-bhavya-akula-cc-by-sa4.jpg' | sha1sum -c
          file src/assets/bio-atlas/specimens/*.jpg
      - name: Save offline evidence assets on this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/bio-atlas/specimens/*.jpg
          if ! git diff --staged --quiet; then
            git commit -m 'assets(anatomy): add two licensed original H&E specimens for offline review'
            git push origin HEAD:feat/anatomy-licensed-histology-specimens-20261106
          fi
