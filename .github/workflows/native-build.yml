name: Lektrus native Android APK and iOS simulator
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_REDIRECT_URL: ${{ vars.LEKTRUS_AUTH_REDIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - name: Verify native project
        run: npm run native:check
      - name: Explain missing production connection
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase build secrets are missing. This test APK runs in local-only mode; set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY to enable account synchronization."
          fi
      - name: Build bundled Lektrus
        run: npm run build
      - name: Sync Android native files
        run: npx cap sync android
      - name: Build signed debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lektrus-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Compile iOS simulator application
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_REDIRECT_URL: ${{ vars.LEKTRUS_AUTH_REDIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run native:check
      - name: Build bundled Lektrus
        run: npm run build
      - name: Sync iOS native files
        run: npx cap sync ios
      - name: Build simulator app without Apple signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check application bundle
        run: test -d ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - uses: actions/upload-artifact@v4
        with:
          name: Lektrus-iOS-simulator-app
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
