name: Lektrus native Android APK and iOS simulator
on:
  pull_request:
    branches: [main, qa/mobile-native-base-20261117]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls-chain:
    name: Verify production HTTPS chain with embedded Android public roots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify live certificate and hostname (without insecure flags)
        shell: bash
        run: |
          mkdir -p artifacts/android-login
          openssl s_client -connect lektrus.ru:443 -servername lektrus.ru \
            -verify_hostname lektrus.ru -verify_return_error -showcerts \
            -CAfile android/app/src/main/res/raw/lektrus_isrg_roots.pem \
            -no-CApath -no-CAstore </dev/null 2>&1 | tee artifacts/android-login/tls-chain.txt
          grep -F 'Verify return code: 0 (ok)' artifacts/android-login/tls-chain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lektrus-HTTPS-chain-diagnostics
          path: artifacts/android-login/tls-chain.txt
  android:
    name: Build permanently signed Android update APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_LEKTRUS_API_ORIGIN: https://lektrus.ru
      LEKTRUS_SIGNING_STORE_BASE64: ${{ secrets.LEKTRUS_SIGNING_STORE_BASE64 }}
      LEKTRUS_SIGNING_STORE_PASSWORD: ${{ secrets.LEKTRUS_SIGNING_STORE_PASSWORD }}
      LEKTRUS_SIGNING_KEY_ALIAS: ${{ secrets.LEKTRUS_SIGNING_KEY_ALIAS }}
      LEKTRUS_SIGNING_KEY_PASSWORD: ${{ secrets.LEKTRUS_SIGNING_KEY_PASSWORD }}
      LEKTRUS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      LEKTRUS_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already includes an Android SDK; the old setup action
      # tries to install the retired SDK package named "tools" and fails.
      - name: Confirm Android SDK is available
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms"
          ls "${ANDROID_HOME}/platforms" | tail -5
      - run: npm ci --no-audit --no-fund
      - name: Verify native project
        run: |
          npm run native:check
          node scripts/test-android-update-policy.mjs
      - name: Verify Android API transport and authentication state
        run: node scripts/test-selfhost-client.mjs
      - name: Build bundled Lektrus
        run: npm run native:build
      - name: Authentication viewport and visual geometry acceptance
        run: |
          node scripts/test-auth-viewport.mjs
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node scripts/test-auth-layout-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auth-layout-screenshots
          path: artifacts/auth-layout
          if-no-files-found: ignore
      - name: Sync Android native files
        run: npx cap sync android
      - name: Require persistent Android signing credentials
        shell: bash
        run: |
          for key in LEKTRUS_SIGNING_STORE_BASE64 LEKTRUS_SIGNING_STORE_PASSWORD LEKTRUS_SIGNING_KEY_ALIAS LEKTRUS_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing $key. APK publication stopped: a temporary debug key would break upgrades and force re-login. Configure a permanent signing key in repository Actions secrets."
              exit 1
            fi
          done
      - name: Build permanently signed upgrade APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          # Signed regular and offline builds share a timestamp-based Android
          # versionCode so either flavor can update the other in place.
          # UTC epoch seconds stay below Play/Android's 2,100,000,000 limit
          # until 2036 and always outrank earlier sequential 329x builds.
          export LEKTRUS_ANDROID_VERSION_CODE="$(date -u +%s)"
          export LEKTRUS_SIGNING_STORE_FILE="$RUNNER_TEMP/lektrus-release.jks"
          trap 'rm -f "$LEKTRUS_SIGNING_STORE_FILE"' EXIT
          printf '%s' "$LEKTRUS_SIGNING_STORE_BASE64" | base64 --decode > "$LEKTRUS_SIGNING_STORE_FILE"
          chmod 600 "$LEKTRUS_SIGNING_STORE_FILE"
          (cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace)
          cp android/app/build/outputs/apk/release/app-release.apk Lektrus-Android.apk
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APK_SIGNER" verify --verbose --print-certs Lektrus-Android.apk > signing-report.txt
          # apksigner verify exits nonzero for an invalid APK signature.
          # Don't hard-code one signing scheme: valid releases can vary by SDK.
          cat signing-report.txt
          # Public certificate fingerprint, verified on the previous working APK.
          # Reject accidentally rotated or temporary keys before any publication.
          grep -Fiq 'certificate SHA-256 digest: ff311eb58be2e59932c28933f1d47f4b14220c64a0764dcefaaff96490fb7c88' signing-report.txt
          echo "Package ru.lektrus.board, versionCode $LEKTRUS_ANDROID_VERSION_CODE"
          test -s Lektrus-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lektrus-Android-Update-APK
          path: Lektrus-Android.apk
          if-no-files-found: error
          retention-days: 14

  android-network:
    name: Signed Android API ${{ matrix.api }} APK — live HTTPS login smoke test
    needs: [android, tls-chain]
    runs-on: ubuntu-latest
    # One permitted ten-minute cooldown after a real production HTTP 429.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Actual signed artifact on the oldest, Redmi/Android 11 and newest OS.
        # The separate runtime workflow exercises every intermediate API.
        api: [24, 30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lektrus-Android-Update-APK
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the signed release APK on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api >= 32 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.api >= 36 && 'swangle' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/test-signed-android-login.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signed-Android-API-${{ matrix.api }}-login-evidence
          path: artifacts/android-login
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: Compile iOS simulator application
    # The standard macOS 26 ARM pool can remain unallocated during runner-capacity incidents.
    # Intel still runs the actual iOS Simulator Xcode build, without skipping validation.
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      VITE_LEKTRUS_API_ORIGIN: https://lektrus.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run native:check
      - name: Build bundled Lektrus
        run: npm run native:build
      - name: Sync iOS native files
        run: npx cap sync ios
      - name: Build simulator app without Apple signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check application bundle
        run: test -d ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - uses: actions/upload-artifact@v4
        with:
          name: Lektrus-iOS-simulator-app
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14

  publish-android:
    name: Publish verified Android APK for the official download page
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android-network, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: lektrus-android-public-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lektrus-Android-Update-APK
      - name: Publish the exact signed, smoke-tested artifact
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$expected" ]] || { echo 'Superseded release; skip publication'; exit 0; }
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APK_SIGNER" verify --verbose --print-certs Lektrus-Android.apk | tee signing-report.txt
          grep -Fiq 'certificate SHA-256 digest: ff311eb58be2e59932c28933f1d47f4b14220c64a0764dcefaaff96490fb7c88' signing-report.txt
          sha256sum Lektrus-Android.apk > Lektrus-Android.apk.sha256
          version="1.0.${GITHUB_RUN_NUMBER}"
          tag="android-v${version}"
          # Never replace a public version with bytes from a different build.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$tag" --pattern 'Lektrus-Android.apk.sha256' --dir "$RUNNER_TEMP/existing-release"
            cmp Lektrus-Android.apk.sha256 "$RUNNER_TEMP/existing-release/Lektrus-Android.apk.sha256"
            exit 0
          fi
          gh release create "$tag" --target "$expected" --title "Lektrus Android $version" --draft \
            --notes "Official signed Android APK. Source: $expected. Verified on Android API 24, 30 and 36. SHA-256 checksum attached." \
            Lektrus-Android.apk Lektrus-Android.apk.sha256
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$expected" ]] || { echo 'Superseded release; leaving draft unpublished'; exit 0; }
          gh release edit "$tag" --draft=false --latest
