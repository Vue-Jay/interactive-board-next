name: Lektrus native Android APK and iOS simulator
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build permanently signed Android update APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_REDIRECT_URL: ${{ vars.LEKTRUS_AUTH_REDIRECT_URL }}
      LEKTRUS_SIGNING_STORE_BASE64: ${{ secrets.LEKTRUS_SIGNING_STORE_BASE64 }}
      LEKTRUS_SIGNING_STORE_PASSWORD: ${{ secrets.LEKTRUS_SIGNING_STORE_PASSWORD }}
      LEKTRUS_SIGNING_KEY_ALIAS: ${{ secrets.LEKTRUS_SIGNING_KEY_ALIAS }}
      LEKTRUS_SIGNING_KEY_PASSWORD: ${{ secrets.LEKTRUS_SIGNING_KEY_PASSWORD }}
      LEKTRUS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      LEKTRUS_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already includes an Android SDK; the old setup action
      # tries to install the retired SDK package named "tools" and fails.
      - name: Confirm Android SDK is available
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms"
          ls "${ANDROID_HOME}/platforms" | tail -5
      - run: npm ci --no-audit --no-fund
      - name: Verify native project
        run: npm run native:check
      - name: Explain missing production connection
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase build secrets are missing. This test APK runs in local-only mode; set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY to enable account synchronization."
          fi
      - name: Build bundled Lektrus
        run: npm run build
      - name: Sync Android native files
        run: npx cap sync android
      - name: Require persistent Android signing credentials
        shell: bash
        run: |
          for key in LEKTRUS_SIGNING_STORE_BASE64 LEKTRUS_SIGNING_STORE_PASSWORD LEKTRUS_SIGNING_KEY_ALIAS LEKTRUS_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing $key. APK publication stopped: a temporary debug key would break upgrades and force re-login. Configure a permanent signing key in repository Actions secrets."
              exit 1
            fi
          done
      - name: Build permanently signed upgrade APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          export LEKTRUS_SIGNING_STORE_FILE="$RUNNER_TEMP/lektrus-release.jks"
          trap 'rm -f "$LEKTRUS_SIGNING_STORE_FILE"' EXIT
          printf '%s' "$LEKTRUS_SIGNING_STORE_BASE64" | base64 --decode > "$LEKTRUS_SIGNING_STORE_FILE"
          chmod 600 "$LEKTRUS_SIGNING_STORE_FILE"
          (cd android && ./gradlew :app:assembleRelease --no-daemon --stacktrace)
          cp android/app/build/outputs/apk/release/app-release.apk Lektrus-Android.apk
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APK_SIGNER" verify --verbose --print-certs Lektrus-Android.apk > signing-report.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signing-report.txt
          grep 'Signer #1 certificate SHA-256 digest:' signing-report.txt
          echo "Package ru.lektrus.board, versionCode $LEKTRUS_ANDROID_VERSION_CODE"
          test -s Lektrus-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lektrus-Android-Update-APK
          path: Lektrus-Android.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Compile iOS simulator application
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_REDIRECT_URL: ${{ vars.LEKTRUS_AUTH_REDIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run native:check
      - name: Build bundled Lektrus
        run: npm run build
      - name: Sync iOS native files
        run: npx cap sync ios
      - name: Build simulator app without Apple signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check application bundle
        run: test -d ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - uses: actions/upload-artifact@v4
        with:
          name: Lektrus-iOS-simulator-app
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
