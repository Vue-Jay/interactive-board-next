name: Atlas precision smoke (one batch)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/atlas-precision-smoke.yml'
      - 'scripts/historical_atlas_name_union.py'
      - 'scripts/test_historical_atlas_name_union.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-precision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  atlas-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: npm ci --no-audit --no-fund
      - name: One combined atlas regression suite
        run: npm run test:atlas
      - name: Independent GEOS polygon-union regressions
        run: |
          python -m pip install --disable-pip-version-check 'shapely==2.1.2'
          python scripts/test_historical_atlas_name_union.py
