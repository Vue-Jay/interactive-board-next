name: Board participant roles acceptance
on:
  pull_request:
    branches:
      - 'main'
      - 'qa/mobile-native-base-20261117'
      - 'qa/mobile-roles-polish-20261119'
    paths:
      - 'src/boardModel.ts'
      - 'src/ShareDialog.tsx'
      - 'src/shareLinks.ts'
      - 'src/accountRoleStore.ts'
      - 'src/authStore.ts'
      - 'src/guestNameCache.ts'
      - 'src/lektrusBoardObjectAuth.ts'
      - 'src/lektrusBoardRolePreview.ts'
      - 'tests/production-browser-connectivity.py'
      - 'tests/participant-roles-browser.py'
      - '.github/workflows/participant-roles.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  browser:
    name: Participant roles and touch UI — round ${{ matrix.round }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: lektrus
          POSTGRES_PASSWORD: test-password-only
          POSTGRES_DB: lektrus
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lektrus -d lektrus"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://lektrus:test-password-only@127.0.0.1:5432/lektrus
      LEKTRUS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      LEKTRUS_JWT_SECRET: CI-only-not-for-production-random-string-1234567890
      LEKTRUS_APPLY_SCHEMA: 'true'
      LEKTRUS_ASSETS_DIR: ${{ runner.temp }}/lektrus-private-assets
      VITE_LEKTRUS_BACKEND: selfhost
      VITE_LEKTRUS_API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/test-lektrus-board-role-preview.mjs
      - run: python -m pip install -r server/requirements-test.txt playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - name: Verify actual API and browser under all participant roles
        run: |
          mkdir -p artifacts/participant-roles "$LEKTRUS_ASSETS_DIR"
          python -m uvicorn app:app --app-dir server --host 127.0.0.1 --port 8000 > artifacts/participant-roles/api.log 2>&1 &
          API_PID=$!
          npm run dev -- --host 127.0.0.1 > artifacts/participant-roles/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$API_PID" "$VITE_PID" || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && curl -fsS http://127.0.0.1:5173/app >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null
          curl -fsS http://127.0.0.1:5173/app >/dev/null
          python tests/participant-roles-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: participant-roles-browser-evidence-round-${{ matrix.round }}
          path: artifacts/participant-roles
          if-no-files-found: warn

  production-browser:
    name: Read-only live browser and API connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python tests/production-browser-connectivity.py
