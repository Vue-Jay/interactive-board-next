name: Read-only publication check ed8451c
on:
  push:
    branches: [verify/live-ed8451c]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify public web bundle and official APK mirror
        shell: bash
        run: |
          python -u - <<'PY'
          import urllib.request, urllib.parse, re, json, time
          origin = "https://lektrus.ru"
          expected = "ed8451c13f52f714edc6ed6d788e9014adfd13ff"
          def get(url, limit=10_000_000):
              req = urllib.request.Request(url, headers={"User-Agent":"Lektrus-public-release-verifier","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req, timeout=15) as response:
                  data = response.read(limit+1)
                  if len(data)>limit: raise ValueError("Response too large")
                  return data
          def web():
              html = get(origin+"/app?release_probe="+str(int(time.time()))).decode()
              queue = list(dict.fromkeys(re.findall(r'["\x27](/assets/[^"\x27\s]+\.js)["\x27]', html)))
              seen = set()
              while queue and len(seen)<60:
                  path = queue.pop(0)
                  if path in seen: continue
                  seen.add(path)
                  data = get(origin+path).decode()
                  if "ink_point_deltas" in data and "point_edits" in data:
                      health = json.loads(get(origin+"/api/v1/health"))
                      print("LIVE_INK_BUNDLE",path,"API_HEALTH",health,flush=True)
                      return True
                  for name in re.findall(r'["\x27](?:\./|/assets/)?([A-Za-z0-9_.-]+-[A-Za-z0-9_-]+\.js)["\x27]',data):
                      path2 = "/assets/"+name
                      if path2 not in seen: queue.append(path2)
              print("Web marker not found in",len(seen),"reachable JS assets",flush=True)
              return False
          def apk():
              release = json.loads(get("https://api.github.com/repos/Vue-Jay/interactive-board-next/releases/latest"))
              if release.get("target_commitish") != expected:
                  print("Awaiting expected signed GitHub release; latest",release.get("tag_name"),flush=True)
                  return False
              version = release["tag_name"].removeprefix("android-v")
              assets = {a["name"]:a for a in release["assets"]}
              digest = get(assets["Lektrus-Android.apk.sha256"]["browser_download_url"],1024).split()[0]
              mirrored = get(origin+"/api/v1/mobile/android-apk/latest/Lektrus-Android.apk.sha256",1024).split()[0]
              if digest != mirrored:
                  print("Awaiting APK mirror checksum",version,flush=True)
                  return False
              req = urllib.request.Request(origin+"/api/v1/mobile/android-apk/latest/Lektrus-Android.apk", method="HEAD",headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  assert urllib.parse.urlsplit(response.geturl()).hostname == "lektrus.ru"
                  assert int(response.headers["Content-Length"]) == assets["Lektrus-Android.apk"]["size"]
              print("LIVE_SIGNED_APK",version,digest.decode(),flush=True)
              return True
          web_ok = apk_ok = False
          for attempt in range(24):
              for name,check in (("web",web),("apk",apk)):
                  if (name=="web" and web_ok) or (name=="apk" and apk_ok): continue
                  try:
                      result=check()
                      if name=="web": web_ok=result
                      else: apk_ok=result
                  except Exception as exc:
                      print(name,type(exc).__name__,str(exc),flush=True)
              if web_ok and apk_ok: break
              time.sleep(20)
          print("PUBLICATION",web_ok,apk_ok,flush=True)
          assert web_ok and apk_ok
          PY
