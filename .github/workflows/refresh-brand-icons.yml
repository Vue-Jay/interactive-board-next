name: Refresh official Lektrus icons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==13.0.0
      - name: Produce web and high-density native assets from supplied Lektrus artwork
        shell: bash
        run: |
          cp assets/lektrus-brand-source.png public/lektrus-icon-192.png
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/lektrus-brand-source.png android/app/src/main/res/drawable-nodpi/lektrus_apk_icon.png
          sips -z 512 512 assets/lektrus-brand-source.png --out public/lektrus-icon-512.png
          python scripts/generate-pwa-icons.py
          sips -z 1024 1024 assets/lektrus-brand-source.png --out assets/icon.png
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#edf5ff' --splashBackgroundColor '#edf5ff'
          # Keep the manifest icon names raster-only across Android versions.
          mv -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_adaptive.xml
          mv -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round_adaptive.xml
          # Older APK thumbnail readers may only look in drawable/ with no qualifier.
          RES=android/app/src/main/res
          cp assets/lektrus-brand-source.png "$RES/drawable/icon.png"
          cp "$RES/mipmap-xxxhdpi/ic_launcher_round.png" "$RES/drawable/icon_round.png"
          for density in ldpi mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/drawable-$density"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/drawable-$density/icon.png"
            cp "$RES/mipmap-$density/ic_launcher_round.png" "$RES/drawable-$density/icon_round.png"
          done
          npx --yes @capacitor/assets@3.0.5 generate --ios --iconBackgroundColor '#edf5ff' --splashBackgroundColor '#edf5ff'
      - name: Verify app image dimensions
        run: |
          test "$(sips -g pixelWidth public/lektrus-icon-192.png | awk '/pixelWidth/{print $2}')" = 192
          test "$(sips -g pixelWidth public/lektrus-icon-512.png | awk '/pixelWidth/{print $2}')" = 512
          test "$(sips -g pixelWidth assets/icon.png | awk '/pixelWidth/{print $2}')" = 1024
      - name: Commit generated Android iOS and web icons
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icon.png public/lektrus-icon-192.png public/lektrus-icon-512.png public/lektrus-pwa-icon-192.png public/lektrus-pwa-icon-512.png public/lektrus-pwa-maskable-512.png android/app/src/main/res ios/App/App/Assets.xcassets
          if ! git diff --cached --quiet; then
            git commit -m 'fix(brand): regenerate every app icon from supplied Lektrus artwork'
            git push origin HEAD:${{ github.ref_name }}
          fi
