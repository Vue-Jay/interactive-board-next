name: Lektrus signed iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-ios:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_REDIRECT_URL: ${{ vars.LEKTRUS_AUTH_REDIRECT_URL }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check required credentials
        shell: bash
        run: |
          for variable in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY APPLE_TEAM_ID IOS_PROFILE_NAME IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing GitHub Actions secret: $variable"
              exit 1
            fi
          done
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync ios
      - name: Import Apple signing certificate and provisioning profile
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-lektrus
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/lektrus-signing.keychain-db"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-signing.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/ios.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/ios-signing.p12" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/ios.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/lektrus.mobileprovision"
      - name: Archive device application
        shell: bash
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lektrus.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive
      - name: Create export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/export-options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>ru.lektrus.board</key><string>$IOS_PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF
      - name: Export signed IPA
        shell: bash
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lektrus.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist" \
            -exportPath "$RUNNER_TEMP/LektrusIPA"
          test -n "$(find "$RUNNER_TEMP/LektrusIPA" -name '*.ipa' -type f -print -quit)"
          mkdir -p ios-signed-artifact
          cp "$RUNNER_TEMP/LektrusIPA/"*.ipa ios-signed-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: Lektrus-iPhone-signed-IPA
          path: ios-signed-artifact/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing data
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ios-signing.p12" "$RUNNER_TEMP/ios.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/lektrus.mobileprovision"
          security delete-keychain "$RUNNER_TEMP/lektrus-signing.keychain-db" || true
