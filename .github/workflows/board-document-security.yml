name: Board document server authorization
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/v248_board_document_authorization.sql'
      - 'tests/board-document-security.sql'
      - '.github/workflows/board-document-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lek_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lek_security_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run isolated SQL authorization tests
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d lek_security_test -f tests/board-document-security.sql
