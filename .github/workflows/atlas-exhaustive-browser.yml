name: Atlas exhaustive browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/LektrusMapAtlas.tsx'
      - 'src/lektrusAtlas*.ts'
      - 'scripts/test-lektrus-atlas-every-country-browser.mjs'
      - '.github/workflows/atlas-exhaustive-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  every-country:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        years:
          - '-123000,-10000,-8000,-5000,-4000,-3000,-2000,-1500,-1000,-700,-500,-400,-323,-300,-200,-100,-1,100,200,300,400,500,600,700,800,900'
          - '1000,1100,1200,1279,1300,1400,1492,1500'
          - '1530,1600,1650,1700,1715,1783,1800,1815,1878,1880'
          - '1900,1914,1920,1930,1938,1945,1960,1994,2000,2010,2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix /tmp/lektrus-atlas-playwright --no-audit --no-fund playwright@1.64.1
          /tmp/lektrus-atlas-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Load actual pinned maps
        env:
          HIST: https://raw.githubusercontent.com/aourednik/historical-basemaps/da7a4b735ecef70aebdc9c73e409d8a2500d50f3
          NATURAL: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson
        run: |
          set -euo pipefail
          mkdir -p /tmp/lektrus-atlas-data
          export OUT=/tmp/lektrus-atlas-data
          grep -Eo 'world_[a-z0-9]+\.geojson' src/lektrusAtlasModel.ts | sort -u | xargs -P 6 -I % curl -fsSL --retry 3 --max-time 60 "$HIST/geojson/%" -o "$OUT/%"
          curl -fsSL --retry 3 --max-time 60 "$HIST/index.json" -o "$OUT/index.json"
          grep -Eo 'ne_[A-Za-z0-9_]+\.geojson' src/lektrusAtlasData.ts | sort -u | xargs -P 6 -I % curl -fsSL --retry 3 --max-time 60 "$NATURAL/%" -o "$OUT/%"
      - name: Verify every map polygon and historical card in the real browser
        env:
          LEKTRUS_ATLAS_DATA_DIR: /tmp/lektrus-atlas-data
          LEKTRUS_PLAYWRIGHT_MODULE: /tmp/lektrus-atlas-playwright/node_modules/playwright
          LEKTRUS_ATLAS_YEARS: ${{ matrix.years }}
          VITE_LEKTRUS_BACKEND: selfhost
          VITE_LEKTRUS_API_ORIGIN: ''
        run: |
          set -euo pipefail
          npm run test:atlas
          npm run dev -- --host 127.0.0.1 --port 4175 --strictPort > /tmp/lektrus-atlas-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-lektrus-atlas-every-country-browser.mjs
