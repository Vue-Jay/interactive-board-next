name: Atlas exhaustive browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/LektrusMapAtlas.tsx'
      - 'src/lektrusAtlas*.ts'
      - 'src/lektrusHistoricalTimeline*.ts'
      - 'scripts/*-lektrus-historical-timeline.mjs'
      - 'scripts/export-lektrus-historical-year.mjs'
      - 'scripts/test-lektrus-atlas-every-country-browser.mjs'
      - 'scripts/test-lektrus-annual-atlas-browser.mjs'
      - 'scripts/audit-lektrus-historical-changes.mjs'
      - 'scripts/audit-historical-unique-geometries.py'
      - 'vite.config.ts'
      - 'scripts/audit-lektrus-atlas-annual.mjs'
      - 'scripts/audit-atlas-2026-boundaries.py'
      - 'scripts/audit-atlas-2026-territories.py'
      - 'scripts/test-atlas-2026-boundaries.py'
      - 'scripts/atlas-2026-capitals.mjs'
      - '.github/workflows/atlas-exhaustive-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modern-boundary-audit-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare every country against independent 2026 geometry
        env:
          NATURAL: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson
        run: |
          set -euo pipefail
          mkdir -p /tmp/lektrus-modern-audit
          for file in ne_10m_admin_0_countries.geojson ne_10m_admin_0_countries_rus.geojson; do
            curl -fsSL --retry 3 --max-time 120 "$NATURAL/$file" -o "/tmp/lektrus-modern-audit/$file"
          done
          python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
          python scripts/test-atlas-2026-boundaries.py
          python scripts/audit-atlas-2026-boundaries.py /tmp/lektrus-modern-audit /tmp/lektrus-modern-audit/boundary-comparison.json
          python scripts/audit-atlas-2026-territories.py /tmp/lektrus-modern-audit /tmp/lektrus-modern-audit/ne_10m_admin_0_countries_rus.geojson /tmp/lektrus-modern-audit/territory-comparison.json
          python scripts/test-atlas-2026-boundaries.py /tmp/lektrus-modern-audit/boundary-candidates.geojson
      - uses: actions/upload-artifact@v4
        with:
          name: lektrus-modern-boundary-comparison-2026
          path: /tmp/lektrus-modern-audit/boundary-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: lektrus-modern-territory-comparison-2026
          path: /tmp/lektrus-modern-audit/territory-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: lektrus-modern-boundary-candidates-2026
          path: /tmp/lektrus-modern-audit/boundary-candidates.geojson
      - uses: actions/upload-artifact@v4
        with:
          name: lektrus-modern-full-candidate-2026
          path: |
            /tmp/lektrus-modern-audit/world-2026-source.geojson
            /tmp/lektrus-modern-audit/world-2026-candidate.geojson
            /tmp/lektrus-modern-audit/world-2026-ndlsa-source.geojson
            /tmp/lektrus-modern-audit/world-2026-ndlsa-candidate.geojson
          retention-days: 14
  every-country:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        years:
          - '1900,1914,1920,1930,1938,1945,1960,1994,2000,2010,2026'
          - '1530,1600,1650,1700,1715,1783,1800,1815,1878,1880'
          - '1000,1100,1200,1279,1300,1400,1492,1500'
          - '-123000,-10000,-8000,-5000,-4000,-3000,-2000,-1500,-1000,-700,-500,-400,-323,-300,-200,-100,-1,100,200,300,400,500,600,700,800,900'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix /tmp/lektrus-atlas-playwright --no-audit --no-fund playwright@1.64.1
          /tmp/lektrus-atlas-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Load actual pinned maps
        env:
          HIST: https://raw.githubusercontent.com/aourednik/historical-basemaps/da7a4b735ecef70aebdc9c73e409d8a2500d50f3
          NATURAL: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson
        run: |
          set -euo pipefail
          mkdir -p /tmp/lektrus-atlas-data
          export OUT=/tmp/lektrus-atlas-data
          grep -Eo 'world_[a-z0-9]+\.geojson' src/lektrusAtlasModel.ts | sort -u | xargs -P 6 -I % curl -fsSL --retry 3 --max-time 60 "$HIST/geojson/%" -o "$OUT/%"
          curl -fsSL --retry 3 --max-time 60 "$HIST/index.json" -o "$OUT/index.json"
          grep -Eo 'ne_[A-Za-z0-9_]+\.geojson' src/lektrusAtlasData.ts | sort -u | xargs -P 6 -I % curl -fsSL --retry 3 --max-time 60 "$NATURAL/%" -o "$OUT/%"
      - name: Verify every map polygon and historical card in the real browser
        env:
          LEKTRUS_ATLAS_DATA_DIR: /tmp/lektrus-atlas-data
          LEKTRUS_PLAYWRIGHT_MODULE: /tmp/lektrus-atlas-playwright/node_modules/playwright
          LEKTRUS_ATLAS_YEARS: ${{ matrix.years }}
          VITE_LEKTRUS_BACKEND: selfhost
          VITE_LEKTRUS_API_ORIGIN: ''
        run: |
          set -euo pipefail
          npm run test:atlas
          npm run dev -- --host 127.0.0.1 --port 4175 --strictPort > /tmp/lektrus-atlas-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-lektrus-atlas-every-country-browser.mjs
  annual-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare years in descending order against Cliopatria v0.2.1
        env:
          HIST: https://raw.githubusercontent.com/aourednik/historical-basemaps/da7a4b735ecef70aebdc9c73e409d8a2500d50f3
          CLIO: https://raw.githubusercontent.com/Seshat-Global-History-Databank/cliopatria/5f433377139a6eeaeacbdc894b70f8805b72c8b5/cliopatria.geojson.zip
        run: |
          set -euo pipefail
          mkdir -p /tmp/lektrus-annual-data
          export OUT=/tmp/lektrus-annual-data
          grep -Eo 'world_[a-z0-9]+\.geojson' src/lektrusAtlasModel.ts | sort -u | xargs -P 6 -I % curl -fsSL --retry 3 --max-time 60 "$HIST/geojson/%" -o "$OUT/%"
          curl -fsSL --retry 3 --max-time 180 "$CLIO" -o "$OUT/cliopatria.zip"
          unzip -Z1 "$OUT/cliopatria.zip"
          mapfile -t geojson_entries < <(unzip -Z1 "$OUT/cliopatria.zip" | grep -E '\.geojson$' | grep -vE '(^|/)__MACOSX/|(^|/)\._')
          test "${#geojson_entries[@]}" -eq 1
          unzip -p "$OUT/cliopatria.zip" "${geojson_entries[0]}" > "$OUT/cliopatria.geojson"
          node --max-old-space-size=4096 scripts/audit-lektrus-atlas-annual.mjs "$OUT/cliopatria.geojson" "$OUT" "$OUT/annual-atlas-audit.json"
          node --max-old-space-size=4096 scripts/build-lektrus-historical-timeline.mjs "$OUT/cliopatria.geojson" "$OUT/history-v1"
          node --max-old-space-size=4096 scripts/test-lektrus-historical-timeline.mjs "$OUT/history-v1" "$OUT/cliopatria.geojson"
          node --max-old-space-size=4096 scripts/audit-lektrus-historical-changes.mjs "$OUT/history-v1"
          python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
          python scripts/audit-historical-unique-geometries.py "$OUT/history-v1" "$OUT" "$OUT/history-v1/unique-geometry-audit.json" "$OUT/cliopatria.geojson"
          npm ci --no-audit --no-fund
          LEKTRUS_ANNUAL_TIMELINE_DIR="$OUT/history-v1" npm run test:atlas
      - uses: actions/upload-artifact@v4
        with:
          name: lektrus-annual-atlas-audit
          path: /tmp/lektrus-annual-data/annual-atlas-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: lektrus-historical-gap-candidates
          path: /tmp/lektrus-annual-data/historical-gap-candidates.geojson
      - uses: actions/upload-artifact@v4
        with:
          name: lektrus-historical-timeline-audit
          path: |
            /tmp/lektrus-annual-data/history-v1/manifest.json
            /tmp/lektrus-annual-data/history-v1/technical-annual-audit.json
            /tmp/lektrus-annual-data/history-v1/change-review-registry.json
            /tmp/lektrus-annual-data/history-v1/unique-geometry-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: lektrus-historical-timeline-candidates
          retention-days: 14
          path: |
            /tmp/lektrus-annual-data/history-v1/manifest.json
            /tmp/lektrus-annual-data/history-v1/change-review-registry.json
            /tmp/lektrus-annual-data/history-v1/packs/*.json
  annual-browser:
    needs: annual-source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: lektrus-historical-timeline-candidates
          path: /tmp/lektrus-annual-preview
      - name: Install dependencies, Chromium and real basemap
        env:
          HIST: https://raw.githubusercontent.com/aourednik/historical-basemaps/da7a4b735ecef70aebdc9c73e409d8a2500d50f3
          NATURAL: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --prefix /tmp/lektrus-atlas-playwright --no-audit --no-fund playwright@1.64.1
          /tmp/lektrus-atlas-playwright/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/lektrus-atlas-data
          export OUT=/tmp/lektrus-atlas-data
          curl -fsSL --retry 3 --max-time 60 "$HIST/index.json" -o "$OUT/index.json"
          grep -Eo 'ne_[A-Za-z0-9_]+\.geojson' src/lektrusAtlasData.ts | sort -u | xargs -P 6 -I % curl -fsSL --retry 3 --max-time 60 "$NATURAL/%" -o "$OUT/%"
      - name: Render each changed map state and click every unique review unit
        env:
          LEKTRUS_ANNUAL_TIMELINE_DIR: /tmp/lektrus-annual-preview
          LEKTRUS_ATLAS_DATA_DIR: /tmp/lektrus-atlas-data
          LEKTRUS_PLAYWRIGHT_MODULE: /tmp/lektrus-atlas-playwright/node_modules/playwright
          LEKTRUS_ATLAS_SHARD: ${{ matrix.shard }}
          LEKTRUS_ATLAS_SHARDS: '6'
          VITE_LEKTRUS_BACKEND: selfhost
          VITE_LEKTRUS_API_ORIGIN: ''
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4175 --strictPort > /tmp/lektrus-atlas-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-lektrus-annual-atlas-browser.mjs
