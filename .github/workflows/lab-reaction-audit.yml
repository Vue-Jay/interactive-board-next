name: Lektrus full reaction audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chemistry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit every registered reaction, kit and simulation
        run: node scripts/test-lektrus-lab-reaction-audit.mjs
      - name: Upload per-reaction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lektrus-reaction-audit
          path: reaction-audit-report.json
          if-no-files-found: warn
          retention-days: 14
