name: Verify published durable ink web and signed APK
on:
  push:
    branches: [qa/durable-ink-production-434]
permissions:
  contents: read
jobs:
  retire-redundant-probe:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retire only the old QA dispatch helper; preserve official main release
        run: |
          set -euo pipefail
          old=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45771802757" --jq '.head_branch+" "+.head_sha+" "+.status')
          if [[ "$old" == "qa/durable-ink-production-434 2113f18bf8b570baba2252db22d0033af2dec12a "* && "$old" != *" completed" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/45771802757/cancel" || true
          fi
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify reachable production application chunks
        run: |
          python3 -u - <<'PY'
          import concurrent.futures, json, re, time, urllib.request
          root="https://lektrus.ru"
          expected="BoardApp-CL-kEUh2.js"
          def get(path):
              req=urllib.request.Request(root+path,headers={"User-Agent":"Lektrus-production-verification","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=10) as r:
                  return r.read(12_000_000).decode()
          def names(s):
              return set(re.findall(r'([\w][\w.-]*-[\w-]{6,}\.js)',s))
          def inspect(name):
              try: return name,get("/assets/"+name)
              except Exception: return name,""
          def check():
              assert json.loads(get("/api/v1/health"))["ok"] is True
              queue=names(get("/app")); seen=set(); board=api=False
              for _ in range(10):
                  if not queue: break
                  batch=sorted(queue,key=lambda n: (0 if n.startswith(("BoardApp-","appEntry-","index-","selfhostApi-")) else 1,n))[:12]
                  queue.difference_update(batch); seen.update(batch)
                  with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                      for name,js in pool.map(inspect,batch):
                          if not js: continue
                          if name.startswith("BoardApp-") and "Сохранено на сервере" in js and "remote-live-ink-layer" not in js:
                              board=True
                              print("Permanent board renderer reachable:",name,flush=True)
                          if "ink_gesture=" in js:
                              api=True
                              print("Durable checkpoint API reachable:",name,flush=True)
                          queue.update(names(js)-seen)
                  if board and api:
                      print("Published durable ink web and healthy production API",flush=True)
                      return True
              print("Probe scanned",len(seen),"chunks; board=",board,"api=",api,flush=True)
              return False
          for n in range(10):
              try:
                  if check(): break
              except Exception as e:
                  print("Probe",n+1,repr(e),flush=True)
              if n==9: raise SystemExit("Published web bundle not confirmed")
              time.sleep(10)
          PY
  verify-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for existing main release; do not trigger any new build
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45771757815" --jq '.status+" "+(.conclusion//"pending")')
            if [ "$status" = "completed success" ]; then
              gh release view android-v1.0.4837 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,targetCommitish --jq 'select(.isDraft==false and .targetCommitish=="3a25cd832735696ab502ecea9e2f870f2360f6b6") | .tagName' | grep -qx android-v1.0.4837
              exit 0
            fi
            if [[ "$status" == completed* ]]; then echo "$status"; exit 1; fi
            sleep 15
          done
          exit 1
      - name: Check real APK mirror, checksum, and durable ink inside package
        run: |
          python3 -u - <<'PY'
          import hashlib,io,json,re,time,urllib.request,zipfile
          origin="https://lektrus.ru"
          version="1.0.4837"
          path="/api/v1/mobile/android-apk/"+version+"/Lektrus-Android.apk"
          def get(p,limit,timeout=20):
              q=urllib.request.Request(origin+p,headers={"Cache-Control":"no-cache","User-Agent":"Lektrus-release-verification"})
              with urllib.request.urlopen(q,timeout=timeout) as r:
                  assert r.status==200 and r.geturl()==origin+p
                  data=r.read(limit+1); assert len(data)<=limit
                  return data
          for i in range(30):
              try:
                  catalog=json.loads(get("/api/v1/mobile/android-update",16384))
                  assert catalog["version"]==version,str(catalog.get("version"))
                  checksum=get(path+".sha256",1024,60).decode().strip()
                  match=re.fullmatch(r"([0-9a-fA-F]{64})[ \t]+\*?Lektrus-Android\.apk",checksum)
                  assert match
                  break
              except Exception as e:
                  print("Mirror",i+1,repr(e),flush=True)
                  if i==29: raise
                  time.sleep(15)
          apk=get(path,100*1024*1024,120)
          assert len(apk)==catalog["size_bytes"]
          assert hashlib.sha256(apk).hexdigest()==match.group(1).lower()
          with zipfile.ZipFile(io.BytesIO(apk)) as z:
              chunks=[n for n in z.namelist() if n.endswith(".js") and "/assets/" in n]
              board=api=False
              for n in chunks:
                  js=z.read(n).decode("utf8")
                  if "/BoardApp-" in n and "Сохранено на сервере" in js and "remote-live-ink-layer" not in js: board=True
                  if "ink_gesture=" in js: api=True
              assert board and api,(board,api)
          print("Verified first-party APK",version,len(apk),"bytes",match.group(1),"durable ink included",flush=True)
          PY
