name: Native mobile runtime QA (isolated)
on:
  pull_request:
    branches: [qa/mobile-native-base-20261117]
  workflow_dispatch:
    inputs:
      phase:
        description: Full acceptance or targeted remaining checks
        type: choice
        options: [full, remaining]
        default: full

permissions:
  contents: read

env:
  # No production accounts, server connections or signing secrets.
  LEKTRUS_NATIVE_QA: '1'
  VITE_LEKTRUS_LOCAL_TEST: 'true'
  VITE_LEKTRUS_BACKEND: ''
  VITE_LEKTRUS_API_ORIGIN: ''
  VITE_SUPABASE_URL: ''
  VITE_SUPABASE_ANON_KEY: ''
  VITE_AUTH_REDIRECT_URL: ''

jobs:
  browser-touch:
    name: Mobile and tablet browser touch regression
    # Browser passed on the identical app tree. This follow-up changes only
    # Android AVD resources; run the browser again in the final full phase.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-native-file-export.mjs
      - name: Validate same-origin board frame security headers
        run: |
          docker run --rm -v "${{ github.workspace }}/deploy/amvera/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy adapt --config /etc/caddy/Caddyfile --validate
          docker run --rm -e LEKTRUS_DOMAIN=:8080 -v "${{ github.workspace }}/deploy/selfhost/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy adapt --config /etc/caddy/Caddyfile --validate
          docker run --rm -d --name lektrus-header-qa -p 127.0.0.1:18080:8080 -v "${{ github.workspace }}/deploy/amvera/Caddyfile:/etc/caddy/Caddyfile:ro" -v "${{ github.workspace }}/index.html:/srv/web/index.html:ro" caddy:2.10.2-alpine
          trap 'docker stop lektrus-header-qa >/dev/null 2>&1 || true' EXIT
          curl -fsSI --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:18080/app | grep -i 'x-frame-options: DENY'
          board=http://127.0.0.1:18080/board/00000000-0000-4000-8000-00000000a11f
          curl -fsSI "$board" | grep -i 'x-frame-options: DENY'
          curl -fsSI "$board?lektrus-board-frame=1" | grep -i 'x-frame-options: SAMEORIGIN'
          curl -fsSI "$board?lektrus-board-frame=1" | grep -i "content-security-policy: frame-ancestors 'self'"
          curl -fsSI 'http://127.0.0.1:18080/app?lektrus-board-frame=1' | grep -i 'x-frame-options: DENY'
      - run: node scripts/test-lektrus-release-browser-smoke.mjs --keyboard-only
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.phase == 'full' }}
      - run: node scripts/test-lektrus-release-browser-smoke.mjs --landscape-only
        if: ${{ !cancelled() }}

  android:
    name: Android API ${{ matrix.api }} native runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # During the repair phase run only the unresolved Android platform.
        # The final manually selected full acceptance retains all three APIs.
        api: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.phase == 'full' && '[30,35,36]' || '[35]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Build isolated native debug APK
        run: |
          npm run native:build
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew :app:assembleDebug --no-daemon)
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Install mobile automation driver
        run: |
          export APPIUM_HOME="$RUNNER_TEMP/appium-drivers"
          echo "APPIUM_HOME=$APPIUM_HOME" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/appium" --no-audit --no-fund appium@3
          "$RUNNER_TEMP/appium/node_modules/.bin/appium" driver install uiautomator2
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # Google API 35 loses the whole emulator during background Google
          # service activity, including with ample host/guest memory. The
          # isolated app does not use Play services; use the AOSP phone image.
          target: ${{ matrix.api == 35 && 'default' || 'google_apis' }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Keep a realistic memory budget for the Android 15 phone image.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim ${{ matrix.api == 35 && '-memory 4096' || '' }}
          script: bash scripts/run-android-mobile-qa.sh "${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'full' && 'full' || 'android-lab' }}"
      - name: Upload Android runtime logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api }}-runtime-evidence
          path: artifacts/mobile-qa/
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iPhone simulator native runtime
    # The preceding commit's iPhone run is still exercising the exact same
    # app and test script. Do not queue another macOS runner for an AVD change.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build isolated native simulator app
        run: |
          npm run native:build
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
          test -d ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
      - name: Install mobile automation driver
        run: |
          export APPIUM_HOME="$RUNNER_TEMP/appium-drivers"
          echo "APPIUM_HOME=$APPIUM_HOME" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/appium" --no-audit --no-fund appium@3
          "$RUNNER_TEMP/appium/node_modules/.bin/appium" driver install xcuitest
      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d,reverse=True) if "iOS" in k for x in d[k] if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || xcrun simctl list devices booted
          xcrun simctl bootstatus "$UDID" -b
      - name: Install and exercise app on iOS simulator
        run: |
          mkdir -p artifacts/mobile-qa
          APP="$PWD/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$SIMULATOR_UDID" "$APP"
          # Capture a native launch independently of Appium/WebDriverAgent.
          # A driver timeout must not hide whether the installed app renders.
          xcrun simctl launch "$SIMULATOR_UDID" ru.lektrus.board
          sleep 15
          xcrun simctl io "$SIMULATOR_UDID" screenshot artifacts/mobile-qa/ios-native-startup.png
          xcrun simctl terminate "$SIMULATOR_UDID" ru.lektrus.board || true
          # Avoid repeatedly building WebDriverAgent during the session startup.
          APPIUM="$RUNNER_TEMP/appium/node_modules/.bin/appium"
          WDA_APP=""
          if "$APPIUM" driver run xcuitest download-wda -- --platform=ios --kind=sim --outdir="$RUNNER_TEMP/wda-download" > artifacts/mobile-qa/wda-prebuild.log 2>&1; then
            WDA_APP=$(find "$RUNNER_TEMP/wda-download" -type d -name '*-Runner.app' -print -quit)
          fi
          if [[ -n "$WDA_APP" ]]; then
            WDA_ARGS=(--wda-app "$WDA_APP")
          else
            WDA="$APPIUM_HOME/node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent/WebDriverAgent.xcodeproj"
            WDA_DERIVED="$RUNNER_TEMP/lektrus-wda"
            xcodebuild -project "$WDA" -scheme WebDriverAgentRunner -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$WDA_DERIVED" \
              CODE_SIGNING_ALLOWED=NO RUN_CLANG_STATIC_ANALYZER=NO COMPILER_INDEX_STORE_ENABLE=NO \
              build-for-testing >> artifacts/mobile-qa/wda-prebuild.log 2>&1
            WDA_ARGS=(--wda-derived-data "$WDA_DERIVED")
          fi
          "$APPIUM" --address 127.0.0.1 --port 4723 > artifacts/mobile-qa/appium.log 2>&1 &
          python3 scripts/test-native-mobile-runtime.py ios --suite "${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'full' && 'full' || 'ios-remaining' }}" --app "$APP" --udid "$SIMULATOR_UDID" "${WDA_ARGS[@]}" --output artifacts/mobile-qa
      - name: Upload iOS runtime logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-evidence
          path: artifacts/mobile-qa/
          if-no-files-found: warn
          retention-days: 14
