name: Board build and eraser regression
concurrency:
  group: board-regression-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:eraser
      - run: npm run test:realtime
      - run: node scripts/test-ink-hit.mjs
      - run: node scripts/test-ink-layer.mjs
      - run: node scripts/test-lektrus-board-three-way-merge.mjs
      - run: node scripts/test-ink-preferences.mjs
      - run: node scripts/test-preview-autosave.mjs
      - run: node scripts/test-board-history.mjs
      - run: node scripts/test-lektrus-ui.mjs
      - run: node scripts/test-lektrus-responsive.mjs
      - run: node scripts/test-lektrus-editor-ux.mjs
      - run: node scripts/test-lektrus-subject-editors.mjs
      - run: node scripts/test-lektrus-subject-catalogue-ui.mjs
      - run: node scripts/test-lektrus-chemistry-ux.mjs
      - run: node scripts/test-lektrus-chemical-equation-workspace.mjs
      - run: node scripts/test-lektrus-chemical-live-board.mjs
      - run: node scripts/test-lektrus-subject-boards.mjs
      - run: node scripts/test-lektrus-interactive-worksheets.mjs
      - run: node scripts/test-lektrus-subject-isolation.mjs
      - run: node scripts/test-lektrus-subject-task-audit.mjs
      - run: node scripts/test-lektrus-language-studio.mjs
      - run: node scripts/test-lektrus-russian-board-work.mjs
      - run: node scripts/test-lektrus-russian-tools-workflow.mjs
      - run: node scripts/test-lektrus-worksheet-growth.mjs
      - run: node scripts/test-lektrus-equation-review.mjs
      - run: node scripts/test-lektrus-organic-nomenclature.mjs
      - run: node scripts/test-lektrus-reaction-library.mjs
      - run: node scripts/test-lektrus-lab-reaction-network.mjs
      - run: node scripts/test-lektrus-lab-classroom-coverage.mjs
      - name: Check chemical property coverage and publish remaining work
        run: |
          node scripts/audit-lektrus-lab-properties.mjs --verify
          node scripts/sync-lektrus-lab-property-minima.mjs --check
          node scripts/audit-lektrus-lab-properties.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
      - run: node scripts/test-lektrus-lab-filtrate-conservation.mjs
      - run: node scripts/test-lektrus-lab-interface-layout.mjs
      - run: node scripts/test-lektrus-lab-phase-equilibrium.mjs
      - run: node scripts/test-lektrus-lab-evaporative-crystallization.mjs
      - run: node scripts/test-lektrus-chemistry-bench.mjs
      - run: node scripts/test-lektrus-physics-templates.mjs
      - run: node scripts/test-lektrus-optics-editor.mjs
      - run: node scripts/test-lektrus-physical-pointer-map.mjs
      - run: node scripts/test-lektrus-physics-collaboration.mjs
      - run: node scripts/test-lektrus-subject-persistence.mjs
      - run: node scripts/test-lektrus-circuit-editor.mjs
      - run: node scripts/test-lektrus-physics-motion-editor.mjs
      - run: node scripts/test-lektrus-colors.mjs
      - run: node scripts/test-lektrus-pointer-interactions.mjs
      - run: node scripts/test-lektrus-mobile-chemistry-controls.mjs
      - run: node scripts/test-lektrus-platform.mjs
      - run: node scripts/test-native-mobile.mjs
      - run: node scripts/test-repo-hygiene.mjs
      - run: npm run build
