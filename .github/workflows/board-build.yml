name: Board build and eraser regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:eraser
      - run: node scripts/test-ink-hit.mjs
      - run: node scripts/test-ink-layer.mjs
      - run: node scripts/test-ink-preferences.mjs
      - run: node scripts/test-preview-autosave.mjs
      - run: node scripts/test-board-history.mjs
      - run: node scripts/test-lektrus-ui.mjs
      - run: node scripts/test-lektrus-responsive.mjs
      - run: node scripts/test-lektrus-editor-ux.mjs
      - run: node scripts/test-lektrus-subject-editors.mjs
      - run: node scripts/test-lektrus-chemistry-ux.mjs
      - run: node scripts/test-lektrus-circuit-editor.mjs
      - run: node scripts/test-lektrus-colors.mjs
      - run: node scripts/test-lektrus-pointer-interactions.mjs
      - run: node scripts/test-lektrus-platform.mjs
      - run: node scripts/test-native-mobile.mjs
      - run: node scripts/test-repo-hygiene.mjs
      - run: npm run build
