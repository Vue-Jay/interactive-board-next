name: Verify Lektrus
on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  build-and-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository agent and CI trigger policies
        run: |
          node scripts/test-github-agent-guard.mjs
          node scripts/test-ci-trigger-scope.mjs
          node scripts/test-lektrus-independent-ink-tools.mjs
          node scripts/test-lektrus-ink-raster-budget.mjs
          node scripts/test-selfhost-client.mjs
      - name: Focused board collaboration, erasing, idle and real Chromium rendering
        run: |
          npm run test:eraser
          npm run test:realtime
          node scripts/test-lektrus-board-three-way-merge.mjs
          node scripts/test-lektrus-collaborative-editors.mjs
          node scripts/test-lektrus-attachment-delivery.mjs
          node scripts/test-lektrus-student-undo-idle.mjs
          node scripts/test-lektrus-runtime-hotpaths.mjs
          node scripts/test-lektrus-peer-ink-browser.mjs
      - name: Typecheck and build
        run: npm run build
      - name: Check curated subject catalogue, saved objects and sentence dragging
        run: |
          node scripts/test-lektrus-release-tools.mjs
          node scripts/test-lektrus-sentence-drag.mjs
      - name: Check sentence drag in real Chrome with mouse, touch and keyboard
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_PATH="$CHROME_BIN" node scripts/test-lektrus-sentence-browser.mjs
      - name: Browser acceptance for current board tools and subject assignment catalogue
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_PATH="$CHROME_BIN" node scripts/test-lektrus-release-browser-smoke.mjs
      - name: Check outside touch dismissal on the mobile board and home
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_PATH="$CHROME_BIN" node scripts/test-lektrus-release-browser-smoke.mjs --tablet-tools-only
          CHROME_PATH="$CHROME_BIN" node scripts/test-lektrus-release-browser-smoke.mjs --home-only
      - name: Check admin user board expansion in Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_PATH="$CHROME_BIN" node scripts/test-lektrus-release-browser-smoke.mjs --admin-only
      - name: Check board links, invitations and auth callback routing
        run: npm run test:board-links
      - name: Check geometry names, closure and touch gestures
        run: |
          npm run test:math-gesture
          node scripts/test-lektrus-board-role-preview.mjs
      - name: Check school geometry constructions
        run: node scripts/test-school-geometry.mjs
