name: Verify Lektrus
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Check curated subject catalogue, saved objects and sentence dragging
        run: |
          node scripts/test-lektrus-release-tools.mjs
          node scripts/test-lektrus-sentence-drag.mjs
      - name: Check sentence drag in real Chrome with mouse, touch and keyboard
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_PATH="$CHROME_BIN" node scripts/test-lektrus-sentence-browser.mjs
      - name: Browser acceptance for current board tools and subject assignment catalogue
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          CHROME_PATH="$CHROME_BIN" node scripts/test-lektrus-release-browser-smoke.mjs
      - name: Check board links, invitations and auth callback routing
        run: npm run test:board-links
      - name: Check geometry names, closure and touch gestures
        run: npm run test:math-gesture
      - name: Check school geometry constructions
        run: node scripts/test-school-geometry.mjs
