name: Refresh approved Lektrus homepage captures
on:
  push:
    branches: [feature/restore-actual-lektrus-site-captures-20261113]
    paths:
      - 'scripts/capture-lektrus-marketing-shots.py'
      - '.github/workflows/refresh-lektrus-site-captures.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    if: github.ref_name == 'feature/restore-actual-lektrus-site-captures-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend
        run: npm ci --no-audit --no-fund
      - name: Install real Chromium browser
        run: |
          python3 -m venv /tmp/lektrus-capture
          /tmp/lektrus-capture/bin/pip -q install playwright==1.64.1
          /tmp/lektrus-capture/bin/python -m playwright install --with-deps chromium
      - name: Re-capture authentic app and seven subject boards (offline, no accounts)
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
          VITE_LEKTRUS_LOCAL_TEST: 'false'
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/lektrus-site-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/demo/board?scene=math > /dev/null; then break; fi
            sleep 1
          done
          /tmp/lektrus-capture/bin/python scripts/capture-lektrus-marketing-shots.py
      - name: Commit true screenshots into this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site/app-home.png public/site/board-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets(site): replace obsolete captures with current real Lektrus screens'
            git push origin HEAD:feature/restore-actual-lektrus-site-captures-20261113
          fi
      - name: Upload capture proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lektrus-approved-homepage-shots
          path: |
            public/site/app-home.png
            public/site/board-*.png
          if-no-files-found: error
