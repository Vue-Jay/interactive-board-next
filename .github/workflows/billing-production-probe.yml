name: Verify published Android billing update on Lektrus
on:
  push:
    branches: [qa/billing-production-431]
permissions:
  contents: read
jobs:
  official-download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact published APK, checksum and billing UI from lektrus.ru
        run: |
          python3 - <<'PY'
          import hashlib, io, json, re, time, urllib.request, zipfile
          origin = "https://lektrus.ru"
          version = "1.0.4832"
          base = "/api/v1/mobile/android-apk/" + version + "/Lektrus-Android.apk"
          def get(path, limit, timeout=20):
              req = urllib.request.Request(origin+path, headers={"User-Agent":"Lektrus-Android-publication-QA","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  assert r.status == 200
                  assert r.geturl() == origin+path, "Unexpected external redirect"
                  data = r.read(limit+1)
                  assert len(data)<=limit, "Unexpected download size"
                  return data
          for attempt in range(24):
              try:
                  catalog = json.loads(get("/api/v1/mobile/android-update",8192))
                  assert catalog["version"] == version, "Catalog version: "+str(catalog.get("version"))
                  checksum = get(base+".sha256",1024,60).decode("ascii").strip()
                  match = re.fullmatch(r"([0-9a-fA-F]{64})[ \t]+\*?Lektrus-Android\.apk",checksum)
                  assert match,"Missing official SHA-256"
                  break
              except Exception as exc:
                  print("Catalog/mirror attempt", attempt+1, str(exc),flush=True)
                  if attempt==23: raise
                  time.sleep(15)
          raw = get(base,100*1024*1024,120)
          assert len(raw)==catalog["size_bytes"],"APK size differs from official catalog"
          assert hashlib.sha256(raw).hexdigest()==match.group(1).lower(),"APK checksum mismatch"
          with zipfile.ZipFile(io.BytesIO(raw)) as apk:
              chunks = [name for name in apk.namelist() if name.endswith(".js") and "/BillingScreen-" in name]
              assert chunks, "BillingScreen bundle missing in signed APK"
              assert any(all(s in apk.read(name).decode("utf-8") for s in ("Что входит в объём хранилища?","billing-back","Сравнить тарифы")) for name in chunks),"Redesigned billing UI not found"
          print("Verified first-party APK", version, "size",len(raw),"sha256",match.group(1),"with redesigned billing bundle",flush=True)
          PY
