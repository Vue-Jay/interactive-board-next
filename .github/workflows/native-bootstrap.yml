name: Prepare Android and iOS native sources

on:
  push:
    branches: [feat/lektrus-native-android-ios]

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve Capacitor dependencies and lockfile
        run: npm install --no-audit --no-fund
      - name: Build embedded web interface
        run: npm run build
      - name: Create native Android project
        run: |
          if [ ! -f android/settings.gradle ]; then npx cap add android; fi
          npx cap sync android
      - name: Create native iOS project
        run: |
          if [ ! -d ios/App ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Generate branded Lektrus icons and splash screens
        shell: bash
        run: |
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#edf5ff' --splashBackgroundColor '#edf5ff'
          npx --yes @capacitor/assets@3.0.5 generate --ios --iconBackgroundColor '#edf5ff' --splashBackgroundColor '#edf5ff'
      - name: Check generated projects and native contract
        run: npm run native:check
      - name: Commit native projects and regenerated npm lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json android ios
          if ! git diff --cached --quiet; then
            git commit -m 'chore(native): generate Android and iOS projects with pinned Capacitor'
            git push origin HEAD:${{ github.ref_name }}
          fi
