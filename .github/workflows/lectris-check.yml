name: Lektrus build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lectris-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: GitHub agent connector policy guard
        run: node scripts/test-github-agent-guard.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and Vite build
        run: npm run build
      - name: Per-viewer ink tool isolation and all five pencil widths
        run: node scripts/test-lektrus-independent-ink-tools.mjs
      - name: Subzero chemistry freezing, tablet device switches and solid sediment
        run: node scripts/test-lektrus-lab-freezing-solids-tablet.mjs
      - name: School geometry regression
        run: node scripts/test-school-geometry.mjs
      - name: Subject tools and experiment persistence regression
        run: node scripts/test-lektrus-subject-persistence.mjs
      - name: Russian and informatics diagrams regression
        run: node scripts/test-lektrus-next-school.mjs
      - name: Interactive biology microscope and tasks
        run: node scripts/test-lektrus-bio-microscope.mjs
      - name: Biology taxonomy classes and cellular detail regression
        run: node scripts/test-lektrus-bio-taxonomy.mjs
      - name: Biology representative anatomical models and source audit
        run: node scripts/test-lektrus-bio-representatives.mjs
      - name: Variable-depth sponge, hydra, moss and algae atlas
        run: node scripts/test-lektrus-bio-alternative.mjs
      - name: Animated biology atlas motion and accessibility regression
        run: node scripts/test-lektrus-bio-motion.mjs
      - name: Biology microscopic plates and anatomical hotspot regression
        run: node scripts/test-lektrus-bio-histology.mjs
      - name: Species-specific organ and tissue plate regression
        run: node scripts/test-lektrus-bio-specimen-plates.mjs
      - name: Biology eight species cellular detail and 24 hotspot regression
        run: node scripts/test-lektrus-bio-cell-plates.mjs
      - name: Complete biology cell atlas and 72 scientific hotspots regression
        run: node scripts/test-lektrus-bio-complete-cell-atlas.mjs
      - name: Complete eight-species organ and tissue atlas cross-sections
        run: node scripts/test-lektrus-bio-complete-organ-tissue.mjs
      - name: Four new evolutionary lineages and scientifically grounded five-level paths
        run: node scripts/test-lektrus-bio-new-lineages.mjs
      - name: Four additional biological lineages and differentiated anatomical levels
        run: node scripts/test-lektrus-bio-further-lineages.mjs
      - name: Real microphotograph microscope slide, pan, pinch and focusing regression
        run: node scripts/test-lektrus-bio-photo-microscope.mjs
      - name: Unified deep zoom anatomy and microscopy spatial regression
        run: node scripts/test-lektrus-bio-unified-zoom.mjs
      - name: Sunflower real epidermis photo and continuous guard cell depth regression
        run: node scripts/test-lektrus-bio-sunflower-epidermis.mjs
      - name: Twenty-six reviewed core tissue and cell anatomy plates
        run: node scripts/test-lektrus-bio-core-microscopy.mjs
      - name: Eight lineage microscopic plates and interactive anatomy
        run: node scripts/test-lektrus-bio-lineage-microscopy.mjs
      - name: Reviewed bird fish amphibian insect mollusc and plant microscopic atlas
        run: node scripts/test-lektrus-bio-representative-microscopy.mjs
      - name: Continuous microscopy and all 183 cell landmarks
        run: node scripts/test-lektrus-bio-feature-focus.mjs
      - name: Biology Mammalia one-class five-layer curriculum and system-location verification
        run: node scripts/test-lektrus-bio-mammal-layers.mjs
      - name: Mammalia six anatomical organ sections and real tissue zoom portals
        run: node scripts/test-lektrus-bio-mammal-organs.mjs
      - name: Mammalia histology tissue layers and real cell focus positions
        run: node scripts/test-lektrus-bio-mammal-tissues.mjs
      - name: Mammalia stage-five original cells and all 18 interactive feature markers
        run: node scripts/test-lektrus-bio-mammal-cells.mjs
      - name: Spatial human atlas zoom camera and five high-quality offline assets
        run: node scripts/test-lektrus-bio-continuous-human.mjs
      - name: Human anatomy SVG and editor preview geometry regression
        run: node scripts/test-lektrus-bio-anatomy-preview-geometry.mjs
      - name: Reviewed translucent human biomodel with selectable anatomy systems
        run: node scripts/test-lektrus-bio-human-systems.mjs
      - name: Verify zero visibility for non-selected human systems and correct depth-linked anatomy
        run: node scripts/test-lektrus-bio-human-exclusive-systems.mjs
      - name: Biology drag and place anatomy exercises
        run: node scripts/test-lektrus-bio-assembly.mjs
      - name: Biology organ systems and relief regression
        run: node scripts/test-lektrus-further-school.mjs
      - name: Approved morphemes genealogy and vocabulary regression
        run: node scripts/test-lektrus-approved-school.mjs
      - name: Russian morphology phonetics and spelling regression
        run: node scripts/test-lektrus-russian-school.mjs
      - name: Interactive geography matching and question cards regression
        run: node scripts/test-lektrus-geography-training.mjs
      - name: Universal board object interactions and assignment creation
        run: node scripts/test-lektrus-object-transform-and-task-create.mjs
      - name: Touch gestures, eraser behavior, and tablet hand regression
        run: node scripts/test-lektrus-touch-gestures.mjs
      - name: Tool categories and video attachment icon
        run: node scripts/test-lektrus-tool-tabs-and-video.mjs
      - name: Text and Graphics objects, diagrams and 3D solids
        run: node scripts/test-lektrus-elements-catalogue.mjs
      - name: Dedicated icon coverage for every subject tool
        run: node scripts/test-lektrus-subject-tool-icons.mjs
      - name: Unified geography and historical atlas regression
        run: node scripts/test-lektrus-atlas.mjs
      - name: Russian-language historical encyclopedia and cross-era search regression
        run: node scripts/test-lektrus-history-encyclopedia.mjs
      - name: Sentence builder and civics reference regression
        run: node scripts/test-lektrus-language-social.mjs
      - name: DNA and taxonomy diagram regression
        run: node scripts/test-lektrus-biology-extension.mjs
      - name: Interactive logic circuit regression
        run: node scripts/test-lektrus-logic-circuit.mjs
      - name: HTTP local network UUID compatibility regression
        run: node scripts/test-lektrus-http-uuid.mjs
      - name: Programming editor compiler and sandbox regression
        run: node scripts/test-lektrus-programming.mjs
      - name: Russian atlas encyclopedia and school facts regression
        run: node scripts/test-lektrus-atlas-school-facts.mjs
      - name: Global mineral clusters and combined political cities regression
        run: node scripts/test-lektrus-atlas-mineral-overview.mjs
      - name: World city boundaries, political colors and mineral map regression
        run: node scripts/test-lektrus-atlas-global-layers.mjs
      - name: Atlas labels and performance regression
        run: node scripts/test-lektrus-atlas-labels.mjs
      - name: Real board interface studio regression
        run: node scripts/test-lektrus-real-interface-editor.mjs
