name: Lektrus build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lectris-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and Vite build
        run: npm run build
      - name: School geometry regression
        run: node scripts/test-school-geometry.mjs
      - name: Subject tools and experiment persistence regression
        run: node scripts/test-lektrus-subject-persistence.mjs
      - name: Real board interface studio regression
        run: node scripts/test-lektrus-real-interface-editor.mjs
