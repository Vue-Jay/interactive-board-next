name: Anatomy visual review (screenshots)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/LektrusSkin*'
      - 'src/lektrusSkin*'
      - 'src/lektrusEpidermis*'
      - 'src/LektrusHumanAnatomy.tsx'
      - 'tests/anatomy-visual-preview.*'
      - 'tests/anatomy-epidermis-*'
      - 'docs/ANATOMY_HUMAN_CANONICAL_PLAN.md'
      - '.github/workflows/anatomy-visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install headless Chromium
        run: npx --yes playwright@1.64.1 install --with-deps chromium
      - name: Render actual skin viewport at four zoom levels
        run: |
          mkdir -p artifacts/anatomy
          npm run dev -- --host 127.0.0.1 > /tmp/lektrus-anatomy-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/tests/anatomy-visual-preview.html > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/tests/anatomy-visual-preview.html > /dev/null
          for zoom in 1 24 120 360; do
            npx --yes playwright@1.64.1 screenshot --browser chromium \
              --wait-for-timeout 2500 --viewport-size "1200,900" \
              "http://127.0.0.1:5173/tests/anatomy-visual-preview.html?zoom=$zoom" \
              "artifacts/anatomy/skin-$zoom.png"
          done
          # Reproduce the user's actual 733% hand and leg view, and
          # verify that the lateral cutaway gradually begins at >1000%.
          for region in hand foot legs; do
            for zoom in 8 16 32; do
              npx --yes playwright@1.64.1 screenshot --browser chromium \
                --wait-for-timeout 2200 --viewport-size "1200,900" \
                "http://127.0.0.1:5173/tests/anatomy-visual-preview.html?region=$region&zoom=$zoom" \
                "artifacts/anatomy/limbs-$region-$zoom.png"
            done
          done
          for layer in corneum granulosum spinosum basale; do
            npx --yes playwright@1.64.1 screenshot --browser chromium \
              --wait-for-timeout 2500 --viewport-size "1200,900" \
              "http://127.0.0.1:5173/tests/anatomy-visual-preview.html?zoom=360&layer=$layer" \
              "artifacts/anatomy/epidermis-$layer-360.png"
          done
          for site in palm sole; do
            for zoom in 85 220; do
              npx --yes playwright@1.64.1 screenshot --browser chromium \
                --wait-for-timeout 2600 --viewport-size "1200,900" \
                "http://127.0.0.1:5173/tests/anatomy-visual-preview.html?site=$site&zoom=$zoom&layer=lucidum" \
                "artifacts/anatomy/thick-$site-$zoom.png"
            done
          done
          for source in thin thick; do
            npx --yes playwright@1.64.1 screenshot --browser chromium \
              --wait-for-timeout 2500 --viewport-size "1200,900" \
              "http://127.0.0.1:5173/tests/anatomy-visual-preview.html?zoom=24&source=$source" \
              "artifacts/anatomy/skin-$source-comparison.png"
          done
          python3 -m venv /tmp/lektrus-epidermis-playwright
          /tmp/lektrus-epidermis-playwright/bin/pip -q install playwright==1.64.1
          /tmp/lektrus-epidermis-playwright/bin/python tests/anatomy-epidermis-browser-smoke.py
          /tmp/lektrus-epidermis-playwright/bin/python tests/anatomy-thick-epidermis-browser-smoke.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-skin-visual-review
          path: artifacts/anatomy/*.png
          if-no-files-found: warn
