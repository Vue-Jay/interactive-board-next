<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
  <body style="margin:0;background:#f3f6fc;font-family:Arial,Helvetica,sans-serif;color:#172b4d">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:36px 14px;background:#f3f6fc">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fff;border:1px solid #dce5f2;border-radius:20px;overflow:hidden">
          <tr><td style="padding:28px 30px 12px;text-align:center">
            <div style="display:inline-block;padding:10px 16px;border-radius:13px;background:#edf3ff;color:#315bc3;font-size:21px;font-weight:800;letter-spacing:-1px">Lektrus</div>
          </td></tr>
          <tr><td style="padding:12px 34px 32px;text-align:center">
            <h1 style="margin:8px 0 10px;font-size:23px;letter-spacing:-.5px">Подтвердите email</h1>
            <p style="margin:0 0 22px;color:#61718b;font-size:14px;line-height:1.6">Введите этот код на странице регистрации Lektrus, чтобы подтвердить адрес и завершить создание аккаунта.</p>
            <div style="display:inline-block;padding:14px 24px;border:1px solid #d8e3f5;border-radius:12px;background:#f7f9fd;color:#244fae;font-size:30px;font-weight:800;letter-spacing:8px">{{ .Token }}</div>
            <p style="margin:22px 0 0;color:#7a879b;font-size:12px;line-height:1.5">Если вы не создавали аккаунт Lektrus, просто проигнорируйте это письмо.</p>
          </td></tr>
        </table>
        <p style="margin:16px 0 0;color:#8793a5;font-size:11px">Lektrus · Пространство для обучения</p>
      </td></tr>
    </table>
  </body>
</html>
