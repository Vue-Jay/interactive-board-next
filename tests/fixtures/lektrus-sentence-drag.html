<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/></head>
<body style="margin:0;padding:24px;background:#e8edf7">
 <main id="root" style="max-width:940px;height:390px;margin:20px auto"></main>
 <script type="module">
  import React from "react";
  import {createRoot} from "react-dom/client";
  import LektrusLanguageSocialView from "/src/LektrusLanguageSocialView.tsx";
  import "/src/lektrusSchoolDiagrams.css";
  const diagram={
   kind:"sentence-builder",title:"Соберите предложение",
   instructions:"Расположите слова в правильном порядке.",
   showKey:false,showHint:false,patternId:"",
   parts:[
    {id:"one",text:"I"}, {id:"two",text:"really"},
    {id:"three",text:"like"}, {id:"four",text:"learning"},
    {id:"five",text:"new"}, {id:"six",text:"words"}
   ]
  };
  // This deliberately runs INSIDE a whiteboard object, not just the
  // standalone editor. The board listens in capture phase before React chips.
  createRoot(document.getElementById("root")).render(
   React.createElement("section",{className:"board",style:{
    height:"100%",touchAction:"none",position:"relative",overflow:"hidden"
   },onPointerDownCapture:event=>{
    if(event.target.closest("[data-board-interactive],button"))return;
    window.__boardCaptured=(window.__boardCaptured||0)+1;
   }},
    React.createElement("div",{className:"board-object",dataset:{object:"sentence-1"},
     style:{width:"98%",height:"100%",transform:"translateZ(0) scale(.96)",transformOrigin:"top left"}},
     React.createElement(LektrusLanguageSocialView,{diagram})
    )
   )
  );
 </script>
</body></html>
